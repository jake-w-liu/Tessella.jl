name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Compiling the package image from scratch peaks at 7 to 12 GB (measured on
# Julia 1.12 and 1.13 with four threads, 2026-11-22). A hosted Linux runner has
# 16 GB and a macOS runner 7 GB: with several image threads the Linux runner
# was lost mid-compile twice. One image thread lowers the peak on Julia 1.13
# (about 3.3 GB locally) and the Linux jobs get swap for Julia 1.12, whose peak
# does not depend on the thread count.
env:
  JULIA_IMAGE_THREADS: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        julia: ['1.12', '1.13']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Add swap space for compiling the package image
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 12G /swapfile.tessella
          sudo chmod 600 /swapfile.tessella
          sudo mkswap /swapfile.tessella
          sudo swapon /swapfile.tessella
          free -g
      - name: Instantiate dependencies
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(;allow_autoprecomp=false)'
      - name: Run optimized numerical and public contract tests
        run: >-
          julia --project=. --startup-file=no --check-bounds=yes -O2
          -e 'foreach(include,ARGS)'
          test/meshing/highorder_elastic_kernel_test.jl
          test/core/gmsh_libm_test.jl test/core/gmsh_windows_power_test.jl
          test/core/public_contract_test.jl
      - name: Run functional package tests
        shell: julia --project=. --startup-file=no --check-bounds=yes {0}
        run: |
          using Pkg
          Pkg.test()

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Instantiate dependencies
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(;allow_autoprecomp=false)'
      - name: Run compiled native kernel coverage
        run: julia --project=. --startup-file=no --compiled-modules=no --check-bounds=yes --code-coverage=user -O2 test/coverage/runtests.jl
      - name: Verify executed function coverage
        run: python test/coverage/verify.py
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-native-kernels-julia-1.13
          path: lcov.info
          if-no-files-found: error
      - name: Record compiled kernel coverage
        shell: python
        run: |
          import os
          from pathlib import Path
          lines = Path("lcov.info").read_text().splitlines()
          found = sum(int(line[3:]) for line in lines if line.startswith("LF:"))
          hit = sum(int(line[3:]) for line in lines if line.startswith("LH:"))
          if found == 0 or hit == 0:
              raise RuntimeError("Coverage contains no executed source lines")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Compiled native kernel suite: {hit}/{found} source lines ({100 * hit / found:.2f}%). Full LCOV report is attached. Functional tests on three operating systems and two Julia versions run separately without coverage instrumentation.\n")

  # The interpreted suite with coverage took about five of the six hours a job
  # may run when it ran in one process; it now runs in three parts
  # (TESSELLA_TEST_SHARD, see test/runtests.jl) and one job checks the merged
  # reports.
  coverage-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      TESSELLA_TEST_SHARD: ${{ matrix.part }}/3
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.14.0-beta1'
      - uses: julia-actions/cache@v2
      - name: Instantiate dependencies
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(;allow_autoprecomp=false)'
      - name: Run interpreted session API coverage
        run: julia --project=. --startup-file=no --compiled-modules=no --check-bounds=yes --compile=min -O0 --code-coverage=user test/coverage/api.jl
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-session-api-julia-1.14-part-${{ matrix.part }}
          path: lcov.info
          if-no-files-found: error

  coverage-api-verify:
    needs: coverage-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-session-api-julia-1.14-part-*
          path: api-coverage
      - name: Verify executed API function coverage
        run: python test/coverage/verify.py api-lcov api-coverage/*/lcov.info

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Add swap space for compiling the package image
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 12G /swapfile.tessella
          sudo chmod 600 /swapfile.tessella
          sudo mkswap /swapfile.tessella
          sudo swapon /swapfile.tessella
          free -g
      - name: Install documentation dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and publish documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
